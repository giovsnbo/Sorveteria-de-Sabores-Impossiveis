<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorveteria de Sabores Impossíveis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="nav">
                <div class="logo">Gelido✦Incanto</div>
                <nav class="menu">
                    <button class="botao-menu" href="#inicio">Início</button>
                    <button class="botao-menu" href="#sabores">Sabores</button>
                    <button class="botao-menu" href="#avaliacoes">Avaliações</button>
                    <button class="botao-menu" href="#sobre">Sobre</button>
                    <button class="botao-menu" href="#contato">Contato</button>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Gelado e Irresistível</h1>
                <p>Onde o sabooOOOr vira encanto.</p>
            </div>
        </section>

        <div class="hero-wave"></div>

        <section class="produtos">
            <div class="container">
                <h2 class="section-title">Favoritos do mês</h2>
                <div class="cards">
                    <!-- CARD 01 -->
                    <div class="sorvete-destaques">
                        <div class="image-container">
                            <div class="gradient-circle"></div>
                            <img src="imagens/ventania-de-inverno.png" alt="sorvete ventania de inverno"
                                class="product-image">
                        </div>

                        <div class="card-content">
                            <h2 class="card-title">Ventania de Inverno</h2>
                            <p class="card-descricao">
                                A combinação perfeita do vento gelado de inverno e um sabor suave, refresca o paladar e deixa seu dia mais leve.
                            </p>
                        </div>
                    </div>
                    
                </div>
            </div>
        </section>
    </main>
</body>

</html>
